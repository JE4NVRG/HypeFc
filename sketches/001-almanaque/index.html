<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HypeFC · Almanaque · Rodada 20/09/2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HYPEFC — DIREÇÃO "ALMANAQUE"
   O produto é um registro medido em público, não um palpite.
   A tela se comporta como um volume impresso de referência:
   papel, fios, réguas, entradas numeradas, notas de margem.
   Zero cartão arredondado, zero brilho, zero ícone de fogo.
   ============================================================ */

:root{
  --paper:#F4F0E6;
  --paper-2:#EBE5D7;
  --paper-3:#DFD7C2;
  --ink:#191610;
  --ink-2:#5A5343;
  --ink-3:#6E6650;       /* 5.0:1 no papel: rótulos pequenos seguem legíveis */
  --rule:#CDC4AE;
  --rule-2:#B0A488;
  --accent:#9B2C15;      /* vermelhão de tipografia — ênfase, nunca CTA de aposta */
  --green:#3F5A36;       /* verde só onde o dado manda: "maior" probabilidade */
  --disp:'Instrument Serif',Georgia,'Times New Roman',serif;
  --text:'Newsreader',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;

  /* --- tokens de movimento (MOTION-SPEC.md) — usar sempre por token --- */
  --m-fast:120ms;   /* feedback de mouse/tato */
  --m-base:200ms;   /* transição de estado */
  --m-slow:320ms;   /* movimento maior, raro */
  --m-count:700ms;  /* contagem do número do registro */
  --m-out:cubic-bezier(.16,1,.3,1);      /* entrando */
  --m-in:cubic-bezier(.55,0,1,.45);      /* saindo */
  --m-inout:cubic-bezier(.65,0,.35,1);   /* movendo entre dois pontos */

  /* --- escudo (CREST-SPEC.md): prato neutro, raio 0, zero sombra --- */
  --crest:22px;           /* linha de partida; 20px no celular (media query 720) */
  --crest-rule:#D9D3C7;   /* régua de 1px do prato */
  --crest-plate:#FFFFFF;  /* prato branco: escudo de fundo claro não some no papel */
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background-color:var(--paper);
  /* a página é papel pautado: fios verticais quase invisíveis */
  background-image:repeating-linear-gradient(to right,rgba(25,22,16,.05) 0 1px,transparent 1px 76px);
  color:var(--ink);
  font-family:var(--text);
  font-size:17px;
  line-height:1.5;
  font-weight:400;
}
img,svg{max-width:100%}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 28px}

/* ---------- micro-tipografia reutilizável ---------- */
.micro{
  font-family:var(--mono);font-size:10px;line-height:1.5;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);
  overflow-wrap:break-word;
}
.micro.ink{color:var(--ink)}
.lab{
  font-family:var(--text);font-size:11px;font-weight:500;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);
}
.rule{height:1px;background:var(--rule);border:0;margin:0}
.rule-ink{height:1px;background:var(--ink);border:0;margin:0}
/* fios desenhados nas bordas dos próprios itens: assim uma última linha
   incompleta não vira bloco bege, e a grade fecha em qualquer contagem */
.grid-lines{
  display:grid;gap:0;
  border-top:1px solid var(--rule);border-left:1px solid var(--rule);
}
.grid-lines > *{
  background:var(--paper);min-width:0;
  border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
}

/* ---------- escudo (CREST-SPEC.md) — a única imagem colorida da direção ----------
   `<img>` comum, nunca `next/image`: o produto documenta em 4 componentes que o lazy
   do next/image não dispara dentro do cockpit e o escudo nunca aparece. Prato neutro
   atrás do escudo porque escudo de fundo claro (Real Madrid, Juventus) some no papel.
   Raio 0, zero sombra, sem filtro, sem moldura de acento: o acento é do dado. */
.crest{
  box-sizing:content-box;                /* 22px é o desenho do escudo; o prato soma 2px + 1px */
  width:var(--crest);height:var(--crest);
  padding:2px;border:1px solid var(--crest-rule);background:var(--crest-plate);
  object-fit:contain;
  vertical-align:baseline;               /* o prato senta na linha de base do nome do time */
  margin-right:8px;                      /* 8px do nome — identificação, não protagonismo */
}
.crest.sm{--crest:18px}                  /* lista "em alta" (CREST-SPEC § tamanhos) */
/* fallback: inicial em caixa de régua, mesmo tamanho do escudo. Sem imagem quebrada,
   sem espaço vazio. `overflow:hidden` faz a linha de base ser a borda inferior — a
   mesma regra que vale para o <img>, então o fallback alinha igual ao escudo. */
.crest-fb{
  display:inline-block;overflow:hidden;
  text-align:center;line-height:var(--crest);
  font-family:var(--mono);font-size:12px;color:var(--ink-2);
}

/* ============================================================
   1. CABEÇALHO — o registro público é a primeira página
   ============================================================ */
.masthead{padding-top:20px}
.topline{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:6px 24px;flex-wrap:wrap;
  padding-bottom:9px;border-bottom:1px solid var(--ink);
}
.brand{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:14px 40px;flex-wrap:wrap;
  padding:16px 0 14px;border-bottom:3px double var(--ink);
}
.brand-l{min-width:0}
.eyebrow{display:block;margin-bottom:6px}
.wordmark{
  font-family:var(--disp);font-weight:400;
  font-size:clamp(54px,11.5vw,124px);line-height:.82;
  letter-spacing:-.015em;margin:0;text-transform:uppercase;
}
.brand-r{max-width:34ch;min-width:0}
.strapline{
  font-family:var(--disp);font-style:italic;
  font-size:clamp(21px,4.2vw,33px);line-height:1.05;
  margin:0 0 8px;
}
.brand-r .micro{color:var(--ink-2)}

/* faixa de registro: 4 números, fios entre eles */
.reg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);
     border-bottom:1px solid var(--ink)}
.reg-cell{background:var(--paper);padding:11px 16px 13px;min-width:0}
.reg-cell b{
  display:block;font-family:var(--disp);font-weight:400;
  font-size:clamp(28px,3.6vw,40px);line-height:1;margin-top:6px;
}
.reg-cell .micro{font-size:9px;letter-spacing:.14em}
.reg-foot{
  display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;
  padding:12px 0 6px;
}
.reg-foot .stamp{margin:0}

/* ---------- abas: fichas de índice, não pills ---------- */
.tabs{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  border-top:1px solid var(--rule);border-bottom:1px solid var(--ink);
  margin-top:26px;
}
.tab{
  appearance:none;background:transparent;border:0;cursor:pointer;
  border-right:1px solid var(--rule);
  padding:13px 12px 11px;text-align:left;
  display:flex;align-items:baseline;gap:9px;min-width:0;
  font-family:var(--text);font-size:13px;font-weight:500;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);
  transition:background-color var(--m-fast) linear,color var(--m-fast) linear,
             transform var(--m-fast) var(--m-inout);
}
.tab:last-child{border-right:0}
.tab .n{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-3);transition:color var(--m-fast) linear}
.tab:hover{background:var(--paper-2);color:var(--ink)}
.tab:hover .n{color:var(--accent)}
/* F. foco com a mesma resposta visual do hover */
.tab:focus-visible{background:var(--paper-2);color:var(--ink)}
.tab:focus-visible .n{color:var(--accent)}
/* B. feedback de pressão imediato */
.tab:active{background:var(--paper-3);transform:scale(.98)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab[aria-selected="true"] .n{color:var(--paper-3)}
.tab[aria-selected="true"]:active{transform:scale(.98)}

/* ============================================================
   2. PAINÉIS
   ============================================================ */
.panel{padding:32px 0 0}
.panel[hidden]{display:none}
.sec-head{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:8px 24px;flex-wrap:wrap;
  padding-bottom:9px;border-bottom:1px solid var(--ink);
}
.sec-head h2{
  font-family:var(--disp);font-weight:400;
  font-size:clamp(30px,4.6vw,46px);line-height:1;margin:5px 0 0;letter-spacing:-.01em;
}
.sec-num{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--accent)}
.sec-meta{text-align:right}

/* nota editorial — a margem que explica o contexto */
.note{
  border-left:2px solid var(--accent);
  padding:2px 0 2px 14px;margin:20px 0 0;
  font-style:italic;font-size:18px;line-height:1.45;
}
.note .micro{display:block;margin-top:6px;font-style:normal}

.kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin-top:22px}
.kpis .kpi{padding:12px 14px 14px}
.kpis .kpi b{
  display:block;font-family:var(--disp);font-weight:400;
  font-size:clamp(26px,3.4vw,42px);line-height:1;margin-top:8px;
}

/* coluna principal + margem lateral */
.lead{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:0 44px;align-items:start;margin-top:26px}
.block-head{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px 18px;flex-wrap:wrap;
  padding-bottom:8px;border-bottom:1px solid var(--rule);
}
.block-head + *{margin-top:0}

/* ---------- filtros de liga ---------- */
.fichas{grid-template-columns:repeat(5,minmax(0,1fr));margin-top:12px}
.ficha{
  appearance:none;border:0;background:var(--paper);cursor:pointer;
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:10px 12px 11px;text-align:left;min-width:0;
  transition:background-color var(--m-fast) linear,transform var(--m-fast) var(--m-inout);
}
.ficha .nm{
  font-family:var(--text);font-size:12px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;line-height:1.25;
  overflow-wrap:anywhere;min-width:0;
}
.ficha .ct{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
/* o `border:0` acima (reset de botão) vencia `.grid-lines > *`: a ficha ficava
   sem os fios da grade e parecia lista crua. Medido: border-bottomWidth era 0px. */
.fichas > .ficha{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.ficha:hover{background:var(--paper-2)}
.ficha:hover .nm{color:var(--accent)}
.ficha:hover .ct{color:var(--accent)}
.ficha:focus-visible{background:var(--paper-2)}
.ficha:focus-visible .nm{color:var(--accent)}
.ficha:focus-visible .ct{color:var(--accent)}
.ficha:active{transform:scale(.98)}
.ficha[aria-pressed="true"]{background:var(--ink)}
.ficha[aria-pressed="true"] .nm{color:var(--paper)}
.ficha[aria-pressed="true"] .ct{color:var(--paper-3)}

.statusline{
  display:flex;justify-content:space-between;gap:6px 18px;flex-wrap:wrap;
  padding:11px 0 10px;border-bottom:1px solid var(--ink);
}
.statusline .who{font-size:13px;letter-spacing:.06em}
.statusline b{font-weight:600}

/* ---------- a lista de partidas: livro-razão, não cards ---------- */
.ledger{position:relative;border-top:0}   /* âncora das linhas que saem (FLIP) */
.entry{
  display:grid;grid-template-columns:minmax(0,1fr) 214px;column-gap:26px;
  padding:15px 0 16px 14px;border-top:1px solid var(--rule);
  box-shadow:inset 3px 0 0 transparent;
  /* só estado: background-color; o fio lateral troca sem animação */
  transition:background-color var(--m-fast) linear;
}
.entry[data-first]{border-top:0}
.entry[data-last]{border-bottom:1px solid var(--rule)}
.entry:hover{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--ink)}
.e-main{min-width:0}
.e-meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.e-meta .liga{color:var(--ink)}
.e-meta .sep{color:var(--ink-3)}
.badge{
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--rule-2);padding:2px 6px 1px;color:var(--ink-2);white-space:nowrap;
}
.badge.alta{border-color:var(--accent);color:var(--accent)}

.e-line{
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:baseline;gap:12px;
}
.e-line .team{
  font-family:var(--text);font-size:22px;line-height:1.15;
  overflow-wrap:anywhere;min-width:0;color:var(--ink);
}
.e-line .team.home{text-align:right}
.e-line .team.away{text-align:left}
.e-line .team.win{font-weight:600}
.e-line .team .dagger{font-style:normal;color:var(--accent);font-size:.8em;padding:0 4px}
.e-line .score{
  font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;
  letter-spacing:.02em;white-space:nowrap;
}
.e-line .score b{font-weight:500}
.e-line .score .dash{color:var(--ink-3);padding:0 6px}
.e-stats{margin-top:9px;font-size:9.5px;letter-spacing:.1em}

.e-prob{min-width:0;border-left:1px solid var(--rule);padding-left:18px}
.e-prob .prob-h{display:block;font-size:8.5px;letter-spacing:.12em;margin-bottom:7px}
.probs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.probs b{
  font-family:var(--mono);font-size:19px;font-weight:500;
  font-variant-numeric:tabular-nums;line-height:1;
}
.probs b.hi{color:var(--green)}
.bar{display:flex;height:5px;margin-top:9px;background:var(--paper-3)}
.bar i{background:var(--rule-2);height:100%;transform-origin:0 50%}
.bar i.hi{background:var(--green)}
.probs-lab{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:5px;
           font-size:8px;letter-spacing:.1em}
.probs-lab i{font-style:normal;min-width:0;overflow-wrap:anywhere}

.empty{padding:26px 0 28px;border-top:1px solid var(--rule);border-bottom:1px solid var(--ink)}
.empty p{font-size:20px;font-family:var(--disp);line-height:1.2;margin:8px 0 6px}
.empty .micro{display:block}

/* ---------- margem (selo de registro sempre à vista) ---------- */
.side{min-width:0;padding-top:2px}
.plate{border:1px solid var(--ink);padding:16px 16px 18px;position:relative}
.plate::before,.plate::after{
  content:"";position:absolute;width:9px;height:9px;border:1px solid var(--ink-3);
}
.plate::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.plate::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.plate-head{padding-bottom:8px;border-bottom:1px solid var(--rule)}
.plate-big{
  font-family:var(--disp);font-weight:400;font-size:60px;line-height:.95;margin:12px 0 4px;
}
.plate-sub{font-size:15px;font-style:italic;color:var(--ink-2);line-height:1.35}
.dl{margin:14px 0 0;border-top:1px solid var(--rule)}
.dl .row{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:7px 0;border-bottom:1px solid var(--rule);
}
.dl .k{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2)}
.dl .v{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.dl .v.big{font-size:15px}
.stamp{
  display:inline-block;margin:14px 0 0;
  border:1px solid var(--accent);color:var(--accent);
  padding:6px 9px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  line-height:1.35;
}
.print-note{margin-top:22px;padding-top:12px;border-top:1px solid var(--ink)}
.print-note p{font-size:13.5px;color:var(--ink-2);line-height:1.42;margin-top:7px}

/* ---------- blocos de dados (índices) ---------- */
.idx{margin-top:14px}
.idx .row{
  display:grid;grid-template-columns:minmax(0,1fr) 54px 120px;
  align-items:center;gap:14px;padding:10px 12px;min-width:0;
}
.idx .row.total{box-shadow:inset 3px 0 0 var(--ink)}
.idx .nm{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;overflow-wrap:anywhere}
.idx .ct{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.track{height:4px;background:var(--paper-3);width:100%}
.track i{display:block;height:100%;background:var(--ink)}

.rank{margin-top:14px}
.rank .row{
  display:grid;grid-template-columns:26px minmax(0,1fr) 44px 130px;
  align-items:center;gap:12px;padding:9px 12px;min-width:0;
}
.rank .pos{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rank .nm{font-size:16px;overflow-wrap:anywhere;min-width:0}
.rank .sc{font-family:var(--mono);font-size:14px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.rank .row:hover{background:var(--paper-2)}
.rank .row:hover .nm{color:var(--accent)}
.rank .row:hover .sc{color:var(--accent)}

/* ---------- registro (recorde) ---------- */
.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);
         border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin-top:22px}
.compare > div{background:var(--paper);padding:16px 16px 18px;min-width:0}
.compare .big{font-family:var(--disp);font-weight:400;font-size:clamp(40px,7vw,72px);line-height:.9;margin:10px 0 6px}
.compare .big.acc{color:var(--accent)}
.compare .sub{font-size:14px;color:var(--ink-2);line-height:1.35}
.model{margin-top:26px}
.mrow{
  display:grid;grid-template-columns:minmax(0,1fr) 92px;align-items:baseline;gap:8px 16px;
  padding:12px 12px 13px;min-width:0;
}
.mrow .lbl{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.mrow .vl{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
.mrow .dt{grid-column:1 / -1;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.mrow.twin{box-shadow:inset 3px 0 0 var(--accent)}
.mnote{font-size:14.5px;font-style:italic;color:var(--ink-2);margin-top:14px;
       border-left:2px solid var(--rule-2);padding-left:14px}

/* ---------- esportes / cobertura ---------- */
.tags{display:flex;flex-wrap:wrap;border-top:1px solid var(--rule);border-left:1px solid var(--rule);margin-top:16px}
.tag{background:var(--paper);padding:9px 12px 10px;font-size:11px;font-weight:500;
     letter-spacing:.11em;text-transform:uppercase;overflow-wrap:anywhere;
     border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.tag .c{font-family:var(--mono);color:var(--ink-3);margin-left:8px;font-size:10px}

/* ---------- pro ---------- */
.tiers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);
       border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);margin-top:22px}
.tier{background:var(--paper);padding:18px 18px 20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.tier.pro{background:var(--paper-2)}
.tier-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
           padding-bottom:9px;border-bottom:1px solid var(--rule)}
.tier-head h3{font-family:var(--disp);font-weight:400;font-size:30px;margin:0;line-height:1}
.tier-head .price{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.tier ul{list-style:none;margin:0;padding:0}
.tier li{font-size:16px;line-height:1.4;padding:9px 0 10px;border-bottom:1px solid var(--rule);display:flex;gap:11px}
.tier li:last-child{border-bottom:0}
.tier li::before{content:"—";color:var(--ink-3);flex:0 0 auto}
.tier .cta{margin-top:auto}

/* ---------- botões-carimbo ---------- */
.btn{
  appearance:none;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:11px 15px;font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  transition:background-color var(--m-fast) linear,color var(--m-fast) linear;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:active{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:var(--accent);border-color:var(--accent)}
.btn:focus-visible{background:var(--ink);color:var(--paper)}
.btn.solid:focus-visible{background:var(--accent);border-color:var(--accent)}
.btn.wide{display:block;width:100%;text-align:center}

/* ---------- rodapé ---------- */
.foot{margin-top:46px;border-top:3px double var(--ink);padding:16px 0 40px}
.foot-top{display:flex;justify-content:space-between;gap:14px 30px;flex-wrap:wrap}
.foot-brand{font-family:var(--disp);font-size:26px;line-height:1;text-transform:uppercase}
.foot .legal{font-size:14.5px;color:var(--ink-2);max-width:56ch;margin-top:10px;font-style:italic}
.share{display:flex;flex-wrap:wrap;gap:8px}
.share .btn{font-size:9.5px;padding:8px 11px}

/* ============================================================
   MOVIMENTO — só comunica estado (MOTION-SPEC.md)
   Chegada de dado, mudança, seleção. Nada de entrada decorativa.
   Só transform / opacity / background-color (e color em estado).
   ============================================================ */
@keyframes mEnter{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes mEnterSm{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes mPanelIn{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes mBar{ from{transform:scaleX(0)} to{transform:scaleX(1)} }

/* A. entrada da página: uma vez, no primeiro paint; 40ms entre blocos */
.m-in{animation:mEnter var(--m-base) var(--m-out) both;animation-delay:var(--md,0ms)}
.m-in-sm{animation:mEnterSm var(--m-base) var(--m-out) both;animation-delay:var(--md,0ms)}

/* B. troca de aba: só o painel que entra anima; o antigo sai sem animação */
.panel.p-in{animation:mPanelIn var(--m-base) var(--m-out) both}

/* D. barra de probabilidade: cresce por transform, a partir da esquerda */
.m-bar{animation:mBar 400ms var(--m-out) both;animation-delay:var(--seg,0ms)}

/* 3. indicador "atualizado às HH:MM": ponto quadrado (raio 0, direção almanaque) */
.upd{display:inline-flex;align-items:center;gap:7px;min-width:0}
.dot{width:6px;height:6px;flex:0 0 auto;background:var(--accent);opacity:.4}

/* ============================================================
   3. COMPOSIÇÃO MOBILE — própria, não o desktop espremido
   ============================================================ */
@media (max-width:1023px){
  .lead{grid-template-columns:minmax(0,1fr);gap:26px 0}
  .side{padding-top:0;border-top:1px solid var(--ink);padding-top:20px}
  .entry{grid-template-columns:minmax(0,1fr)}
  .e-prob{border-left:0;padding-left:0;margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
  .probs b{font-size:22px}
  .idx .row{grid-template-columns:minmax(0,1fr) 44px 84px}
  .rank .row{grid-template-columns:22px minmax(0,1fr) 38px 78px}
}

@media (max-width:720px){
  body{font-size:16.5px;background-image:none}
  .wrap{padding:0 16px}
  .masthead{padding-top:12px}
  .topline{flex-direction:column;align-items:flex-start;gap:4px}
  .brand{flex-direction:column;align-items:flex-start;gap:10px;padding:12px 0 11px}
  .wordmark{font-size:46px}
  .brand-r{max-width:100%}
  .strapline{font-size:22px;margin-bottom:0}
  #promessa-sub{display:none}          /* no mobile a manchete já diz a frase inteira */
  .reg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .reg-cell{padding:9px 12px 11px}
  .reg-cell b{font-size:27px}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid var(--ink);margin-top:18px}
  .tab{border-bottom:1px solid var(--rule)}
  .tab:nth-child(2n){border-right:0}
  .tab:nth-child(5){grid-column:1 / -1;border-bottom:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis .kpi b{font-size:34px}
  .kpis .kpi:last-child{grid-column:1 / -1}
  .fichas{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ficha{padding:9px 10px 10px;min-height:44px}
  .btn{min-height:44px}
  .ficha .nm{font-size:10.5px;letter-spacing:.07em}
  .ficha .ct{font-size:11px}
  .e-line{grid-template-columns:minmax(0,1fr);gap:4px}
  .e-line .team.home{text-align:left}
  .e-line .team.away{text-align:left}
  .e-line .score{order:-1;font-size:26px;margin-bottom:4px}
  .e-line .score .dash{padding:0 7px}
  .entry{padding:14px 0 15px 12px}
  .entry:hover{box-shadow:inset 3px 0 0 var(--accent)}
  .ledger .crest{--crest:20px}      /* linha de partida no celular: 20px (CREST-SPEC) */
  .compare{grid-template-columns:repeat(1,minmax(0,1fr))}
  .tiers{grid-template-columns:repeat(1,minmax(0,1fr))}
  .idx .row{grid-template-columns:minmax(0,1fr) 40px}
  .idx .track{display:none}
  .rank .row{grid-template-columns:20px minmax(0,1fr) 36px}
  .rank .track{display:none}
  .mrow{grid-template-columns:minmax(0,1fr) 76px}
  .note{font-size:17px}
  .sec-meta{display:none}
}

/* ============================================================
   4. MOVIMENTO REDUZIDO — nenhuma informação depende de movimento:
      pulso, contagem e entrada não acontecem; o valor final aparece
   ============================================================ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-delay:0ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    transition-delay:0ms !important;
    /* Medido: com 0.01ms o Chrome deixa a animação/transição "pending"
       (currentTime 0) e o elemento fica preso no estado inicial — a entrada
       ficava em opacity 0 e o hover não respondia. Aqui nada é aplicado:
       o valor final aparece direto e nada fora da lista permitida roda. */
    animation-name:none !important;
    transition-property:none !important;
  }
}

  /* Imagem que falha vira a mesma caixa de régua com a inicial (nunca imagem quebrada,
     nunca espaço vazio). `error` não borbulha, mas é capturável: listener de captura. */
  function caiNoFallback(img){
    var time = img.getAttribute("data-time") || "";
    var caixa = document.createElement("span");
    caixa.className = "crest crest-fb" + (img.classList.contains("sm") ? " sm" : "");

  document.addEventListener("error", function(e){

  /* ---------------- movimento (MOTION-SPEC.md) ----------------
     Os tokens do CSS são a fonte da verdade: lidos aqui, nunca duplicados.
     Sem biblioteca, sem rAF permanente. Só anima o que comunica estado. */
  var RAIZ = document.documentElement;
  var MQ = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  function reduzido(){ return !!(MQ && MQ.matches); }
  function token(nome, alt){
    var v = getComputedStyle(RAIZ).getPropertyValue(nome).trim();
    return v || alt;
  }
  function paraMs(v, alt){
    var m = /^\s*([-\d.]+(?:[eE][-+]?\d+)?)(ms|s)\s*$/.exec(String(v));
    if (!m) return alt;
    var n = parseFloat(m[1]);
    return m[2] === "s" ? n * 1000 : n;
  }
  function curva(txt){
    var m = /cubic-bezier\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*,\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)/.exec(String(txt));
    var p = m ? [parseFloat(m[1]), parseFloat(m[2]), parseFloat(m[3]), parseFloat(m[4])] : [.25, .1, .25, 1];
    var x1 = p[0], y1 = p[1], x2 = p[2], y2 = p[3];
    function A(a, b){ return 1 - 3 * b + 3 * a; }
    function B(a, b){ return 3 * b - 6 * a; }
    function C(a){ return 3 * a; }
    function f(t, a, b){ return ((A(a, b) * t + B(a, b)) * t + C(a)) * t; }
    function df(t, a, b){ return 3 * A(a, b) * t * t + 2 * B(a, b) * t + C(a); }
    return function(x){
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      var t = x, i, d;
      for (i = 0; i < 8; i++){ d = df(t, x1, x2); if (!d) break; t -= (f(t, x1, x2) - x) / d; }
      return f(t, y1, y2);
    };
  }
  var M_FAST  = paraMs(token("--m-fast", "120ms"), 120);
  var M_BASE  = paraMs(token("--m-base", "200ms"), 200);
  var M_COUNT = paraMs(token("--m-count", "700ms"), 700);
  var E_IN    = token("--m-in", "cubic-bezier(.55,0,1,.45)");
  var E_INOUT = token("--m-inout", "cubic-bezier(.65,0,.35,1)");
  var curvOUT = curva(token("--m-out", "cubic-bezier(.16,1,.3,1)"));
  var NF = new Intl.NumberFormat("pt-BR");

  /* ao terminar, a classe sai — a animação deixa de existir (getAnimations() volta a 0)
     e pode ser reaplicada quando o estado mudar de novo */
  var CLASSE_DA_ANIMACAO = { "mEnter":"m-in", "mEnterSm":"m-in-sm", "mPanelIn":"p-in", "mBar":"m-bar" };
  document.addEventListener("animationend", function(e){
    var cls = CLASSE_DA_ANIMACAO[e.animationName];

  /* Com movimento reduzido nada depende de animação: as classes que animam
     não ficam aplicadas. (Medido: com duração 0.01ms o Chrome deixa a
     animação "pending" e prende o elemento no estado inicial — opacity 0.) */
  function limparMovimento(){
    Array.prototype.forEach.call(document.querySelectorAll(".m-in,.m-in-sm,.m-bar,.p-in"), function(el){
      el.classList.remove("m-in"); el.classList.remove("m-in-sm");

    });

  /* 3. indicador "atualizado às HH:MM": 3 pulsos de 2s na carga e para;

  var ponto = $("#dot"), pulso = null;
  function pulsarPonto(){
    if (!ponto || reduzido() || pulso) return;
    pulso = ponto.animate(
      [{opacity:.4, transform:"scale(1)"}, {opacity:1, transform:"scale(1.35)"}, {opacity:.4, transform:"scale(1)"}],
      {duration:2000, iterations:3, easing:E_INOUT}
    );
    var fim = function(){ pulso = null; };
    pulso.finished.then(fim, fim);
  }

  var contouRegistro = false;
  function contarRegistro(){
    var el = $("#reg-cards");
    if (!el || contouRegistro) return;
    contouRegistro = true;
    var alvo = R.cards_liquidados;
    if (reduzido()){ el.textContent = NF.format(alvo); return; }
    var t0 = 0;
    function passo(agora){
      if (!t0) t0 = agora;
      var p = Math.min(1, (agora - t0) / M_COUNT);
      el.textContent = NF.format(Math.round(curvOUT(p) * alvo));
      if (p < 1) requestAnimationFrame(passo);

    tabs.forEach(function(t, i){

  function entryKey(m){ return m.liga + "|" + m.casa.time + "|" + m.fora.time; }

    var caixa = document.createElement("div");

  }
  /* C. FLIP: a linha que sai fica fora do fluxo, no lugar em que estava,
     esmaecendo; as que ficam já viajam por transform até a posição final */
  function soltarLinha(el, caixa){
    var r = el.getBoundingClientRect();
    el.dataset.ghost = "1";
    el.style.position = "absolute";
    el.style.left = (r.left - caixa.left) + "px";
    el.style.top  = (r.top  - caixa.top) + "px";
    el.style.width = r.width + "px";
    el.style.margin = "0";
    el.style.pointerEvents = "none";
    var a = el.animate([{opacity:1},{opacity:0}], {duration:M_FAST, easing:E_IN, fill:"forwards"});
    var fim = function(){ el.remove(); };
    a.finished.then(fim, fim);

  function primeiraEUltima(ledger, linhas){
    Array.prototype.forEach.call(ledger.querySelectorAll(".entry"), function(el){

  function paintLedger(flip){
    var ledger = $("#ledger");

    var f = D.filtros_liga.filter(function(x){ return x.liga === state.liga; })[0];

    /* FIRST: posição atual das linhas (a fantasma da troca anterior não conta) */
    var antigas = Array.prototype.slice.call(ledger.querySelectorAll(".entry")).filter(function(el){
      return el.dataset.ghost !== "1";

        '<p class="sub">' + esc(R.comparacao) + "</p></div>" +
      '<div><span class="micro">Lift</span><div class="big acc">' + esc(R.lift) + "</div>" +
        '<p class="sub">Diferença entre as duas colunas</p></div>' +
    "</div>" +
    '<div class="dl" style="margin-top:22px;border-top:1px solid var(--ink)">' +
      '<div class="row"><span class="k">Cards liquidados</span><span class="v big">' + esc(R.cards_liquidados) + "</span></div>" +
      '<div class="row"><span class="k">Rodadas</span><span class="v big">' + esc(R.rodadas) + "</span></div>" +
      '<div class="row"><span class="k">Corte</span><span class="v big">' + esc(R.corte) + "</span></div>" +
      '<div class="row"><span class="k">Reconstrução</span><span class="v">' + esc(R.detalhe) + "</span></div>" +
    "</div>" +
    '<p class="stamp" style="margin-top:20px">' + esc(R.sem_edge) + "</p>" +
    '<div class="block-head" style="margin-top:34px"><span class="lab">Modelo · comparações</span>' +
      '<span class="micro">publicado no painel</span></div>' +
    '<div class="model grid-lines">' +
      D.modelo.map(function(m, i){
        var twin = i >= 2 ? " twin" : "";
        return '<div class="mrow' + twin + '"><span class="lbl">' + esc(m.rotulo) + "</span>" +
          '<span class="vl">' + esc(m.valor) + "</span>" +
          '<span class="dt">' + esc(m.detalhe) + "</span></div>";
      }).join("") +
    "</div>" +
    '<p class="mnote">As duas últimas linhas marcam ' + esc(D.modelo[2].valor) + " nas duas pontas: " +
      esc(D.modelo[2].detalhe) + " e " + esc(D.modelo[3].detalhe) + ". " +
      "Sem promessa de edge no palpite.</p>";

  /* ---------------- painel IV — Esportes ---------------- */
  $("#p-esportes").innerHTML =
    '<div class="sec-head">' +
      "<div><span class=\"sec-num\">§ IV</span><h2>Esportes</h2></div>" +
      '<span class="sec-meta micro">cobertura deste volume</span>' +
    "</div>" +
    '<p class="note">Este volume publica ' + esc(KPI["LIGAS"]) + " ligas de futebol, " + esc(KPI["JOGOS"]) +
      " jogos e " + esc(KPI["GOLS"]) + " gols na rodada " + esc(D.capa.rodada) +
      '<span class="micro">Sem dados medidos de outras modalidades neste volume</span></p>' +
    '<div class="kpis grid-lines">' + kpiHTML() + "</div>" +
    '<div class="block-head" style="margin-top:30px"><span class="lab">Ligas cobertas</span>' +
      '<span class="micro">' + ligas.length + " de " + ligas.length + " com jogos no recorte</span></div>" +
    '<div class="tags">' +
      ligas.map(function(l){
        return '<span class="tag">' + esc(l.liga) + '<span class="c">' + l.jogos + "</span></span>";
      }).join("") +
    "</div>" +
    '<p class="mnote">O almanaque publica o que já está medido. Modalidades fora do futebol não entram neste volume ' +
      "enquanto não houver registro liquidado para publicar.</p>";

  /* ---------------- painel V — Pro ---------------- */
  $("#p-pro").innerHTML =
    '<div class="sec-head">' +
      "<div><span class=\"sec-num\">§ V</span><h2>Pro</h2></div>" +
      '<span class="sec-meta micro">' + esc(P.preco_mes) + " · " + esc(P.preco_ano) + "</span>" +
    "</div>" +
    '<p class="note">O Pro não vende palpite. Vende alerta e histórico do registro.' +
      '<span class="micro">' + esc(M.promessa) + "</span></p>" +
    '<div class="tiers">' +
      '<div class="tier"><div class="tier-head"><h3>Grátis</h3><span class="price">sem cobrança</span></div>' +
        "<ul>" + P.gratis.map(function(g){ return "<li>" + esc(g) + "</li>"; }).join("") + "</ul>" +
        '<div class="cta"><button class="btn wide" type="button">' + esc(P.cta_secundario) + "</button></div></div>" +
      '<div class="tier pro"><div class="tier-head"><h3>Pro</h3>' +
        '<span class="price">' + esc(P.preco_mes) + "<br>" + esc(P.preco_ano) + "</span></div>" +
        "<ul>" + P.pro.map(function(g){ return "<li>" + esc(g) + "</li>"; }).join("") + "</ul>" +
        '<div class="cta"><button class="btn solid wide" type="button">' + esc(P.cta) + "</button></div></div>" +
    "</div>" +
    '<p class="mnote">' + esc(P.rodape_lista) + "</p>" +
    '<div class="dl" style="margin-top:24px">' +
      '<div class="row"><span class="k">Acerto em ' + esc(R.cards_liquidados) + " cards</span><span class=\"v big\">" + esc(R.acerto) + "</span></div>" +
      '<div class="row"><span class="k">' + esc(R.comparacao) + '</span><span class="v">' + esc(R.lift) + "</span></div>" +
      '<div class="row"><span class="k">Governança</span><span class="v">' + esc(R.sem_edge) + "</span></div>" +
    "</div>";

  paintLedger(false);
  if (reduzido()) limparMovimento();   /* nada preso no estado inicial */
  activate(0, false);

  /* 3. o ponto de "atualizado às HH:MM" pulsa 3 vezes (2s por ciclo) e para */
  pulsarPonto();
  var toplineEl = $(".topline");
  if (toplineEl){
    toplineEl.addEventListener("mouseenter", pulsarPonto);
    toplineEl.addEventListener("focusin", pulsarPonto);
  }

  /* E. o número do registro conta uma única vez, ao entrar em tela */
  var regEl = $("#reg-cards");
  if (regEl && "IntersectionObserver" in window){
    var io = new IntersectionObserver(function(ents){
      ents.forEach(function(en){ if (en.isIntersecting){ io.disconnect(); contarRegistro(); } });
    }, {threshold:.5});
    io.observe(regEl);
    setTimeout(contarRegistro, 2500);   /* rede de segurança: o valor nunca fica em 0 */
  } else {
    contarRegistro();
  }

  window.__almanaque = {
    data: D, state: state, paint: paintLedger, activate: activate,
    /* exposto para a verificação medida do escudo (CREST-SPEC.md) */
    escudos: ESCUDOS, escudoHTML: escudoHTML, caiNoFallback: caiNoFallback
  };
})();
</script>
</body>
</html>
